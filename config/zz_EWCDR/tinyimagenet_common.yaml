dataset: tiny-imagenet
data_root: ./data
shuffle: true
pin_memory: true

total_cls_num: 200
image_size: 64
init_epoch: 200
epoch: 180
val_per_epoch: 5
batch_size: 128
num_workers: 8
testing_times: 1
seed: 1993

train_trfms:
  - RandomResizedCrop: {size: 64}
  - RandomHorizontalFlip: {}
  - ToTensor: {}
  - Normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
test_trfms:
  - Resize: {size: 64}
  - CenterCrop: {size: 56}
  - ToTensor: {}
  - Normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

init_optimizer:
  name: SGD
  kwargs: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005}
optimizer:
  name: SGD
  kwargs: {lr: 0.1, momentum: 0.9, weight_decay: 0.0002}
init_lr_scheduler:
  name: MultiStepLR
  kwargs: {gamma: 0.1, milestones: [60, 120, 170]}
lr_scheduler:
  name: MultiStepLR
  kwargs: {gamma: 0.1, milestones: [70, 120, 150]}

buffer:
  name: LinearBuffer
  kwargs: {buffer_size: 0, batch_size: 128, strategy: herding}
