dataset: &dataset binary_cifar10
data_root: ./datasets
total_cls_num: &total_cls_num 10
init_cls_num: &init_cls_num 2
inc_cls_num: &inc_cls_num 2
task_num: 5
image_size: 32
save_path: ./

train_trfms:
  - RandomCrop:
      size: 32
      padding: 4
  - RandomHorizontalFlip: {}
  - ToTensor: {}
  - Normalize:
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2470, 0.2435, 0.2615]
test_trfms:
  - ToTensor: {}
  - Normalize:
      mean: [0.4914, 0.4822, 0.4465]
      std: [0.2470, 0.2435, 0.2615]

seed: 0
deterministic: True
device_ids: auto
n_gpu: 1
num_workers: 4
pin_memory: False

batch_size: 32
init_epoch: 50
epoch: 50
val_per_epoch: 50
testing_times: 1
testing_per_task: True
setting: task-agnostic
eval_with_test: True

optimizer:
  name: SGD
  kwargs:
    lr: 0.1
    momentum: 0.0
    weight_decay: 0.0

lr_scheduler:
  name: Constant
  kwargs: {}

backbone:
  name: resnet18
  kwargs:
    num_classes: *total_cls_num
    args:
      dataset: *dataset

buffer:
  name: LinearBuffer
  kwargs:
    buffer_size: 500
    batch_size: 32
    strategy: random

classifier:
  name: PaperER
  kwargs:
    num_class: *total_cls_num
    feat_dim: 512
    init_cls_num: *init_cls_num
    inc_cls_num: *inc_cls_num
    minibatch_size: 32
    buffer_storage: tensor
